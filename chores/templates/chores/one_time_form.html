<!-- chores/templates/chores/one_time_form.html -->
{% extends "base.html" %}

{% block title %}One-Time Chore - ChoreFlow{% endblock %}

{% block content %}
<h2>Create One-Time Chore</h2>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" class="mt-3">
    {% csrf_token %}

    <div class="mb-3">
        <label for="name" class="form-label">Chore Name</label>
        <input type="text" class="form-control" id="name" name="name" required>
    </div>

    <div class="mb-3">
        <label for="category" class="form-label">Category</label>
        <select class="form-select" id="category" name="category" required>
            <option value="">-- Select Category --</option>
            {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label for="difficulty" class="form-label">Difficulty</label>
        <select class="form-select" id="difficulty" name="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
        </select>
    </div>

    <div class="mb-3">
        <label for="due_date" class="form-label">Due Date</label>
        <input type="date" class="form-control" id="due_date" name="due_date" value="{{ form.due_date }}">
    </div>

    <button type="submit" class="btn btn-primary">Create One-Time Chore</button>
    <a href="{% url 'chore_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
