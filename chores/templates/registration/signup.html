<!-- chores/templates/registration/signup.html -->
{% extends "base.html" %}

{% block title %}Sign Up - ChoreFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>Sign Up</h4>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="mb-3">
                        <label for="invite_code" class="form-label">Invite Code <span class="text-muted">(optional)</span></label>
                        <input type="text" class="form-control" id="invite_code" name="invite_code" value="{{ invite_code|default:'' }}">
                        <div class="form-text">Enter an invite code to join an existing household, or leave blank to create a new one.</div>
                    </div>

                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>

                <hr>
                <p class="text-muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
